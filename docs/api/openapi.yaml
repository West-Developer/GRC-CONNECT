  /api/v1/student-profiles/{studentProfile}/freshman-payment-preview:
    get:
      operationId: getStudentProfileFreshmanPaymentPreview
      summary: Preview a freshman's or transferee's first payment
      description: >
        Accounting Staff only (ADR 0043, amended 2026-10-05). Shows what
        confirming this student's first payment will do before the Cashier
        presses the button. For a freshman: the section they would be submitted
        to (the first block, in block-number order, with a seat in every
        subject; only for the Regular enrollment category), its seats and the
        estimated assessment, or that every section is full and the payment
        would be held as credit. For a transferee: the subjects they chose,
        waiting at the payment hold, and the estimated assessment, or that they
        have not chosen yet and the payment would be held. Writes nothing.
        Refused (422) for a student who does not pay first.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: studentProfile
          in: path
          required: true
          description: Student profile ID.
          schema:
            type: integer
      responses:
        "200":
          description: What the confirmation would do.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreshmanPaymentPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
