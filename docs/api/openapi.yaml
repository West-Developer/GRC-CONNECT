    StoreStudentProfileRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - email
        - gender
        - birth_date
        - citizenship
        - contact_number
        - street_barangay
        - town_city
        - province
        - program_id
        - year_level
        - student_type
        - privacy_notice_acknowledged
        - privacy_notice_version
      properties:
        first_name:
          type: string
          maxLength: 255
        middle_name:
          type: [string, 'null']
          maxLength: 100
          description: >
            The student's full middle name. The server derives the initial from it;
            every display of the name shows only that initial (ADR 0053).
        last_name:
          type: string
          maxLength: 255
        suffix:
          type: [string, 'null']
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 255
        gender:
          type: string
          enum: [M, F]
        birth_date:
          type: string
          format: date
          description: Y-m-d, after 1900-01-01 and before today.
        citizenship:
          type: string
          maxLength: 100
        contact_number:
          type: string
          pattern: '^[0-9+()\-\s]{7,30}$'
          description: Digits, `+`, spaces, dashes or brackets, 7 to 30 characters.
        street_barangay:
          type: string
          maxLength: 255
        town_city:
          type: string
          maxLength: 255
        province:
          type: string
          maxLength: 255
        requirements_verified:
          type: boolean
          const: true
          description: >
            The older single confirmation. Required only when `requirement_type_ids` is not sent;
            ignored when it is.
        requirement_type_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
          description: >
            The Admission requirements ticked off for the new student (stakeholder Doc 20). It may be
            partial or empty: the account is created and the missing ones stay on the student's
            checklist. It may only name active requirements that apply to the chosen `student_type`
            (see `GET /admission-requirement-types`), otherwise the request is refused with 422 on
            `requirement_type_ids`. Each id is recorded as submitted. `requirements_verified_at` on
            the new profile is set only when every applicable requirement was ticked (or, with no
            list, when `requirements_verified` was sent).
        has_existing_student_number:
          type: boolean
          default: false
          description: >
            `false` (the default): the server assigns the next sequential student number
            (`YYYY-MM-NNNNN`, one running counter per year, year and month in Asia/Manila) and
            `student_number` must not be sent. `true`: Admission enters the number a Returnee or an
            Existing Student already has, `student_number` is required, and the counter is not
            touched. Only `returnee` and `existing_student` may use it, otherwise 422 on this field
            (ADR 0042).
        student_number:
          type: string
          maxLength: 255
          pattern: '^\d{4}-(0[1-9]|1[0-2])-\d{5}$'
          description: >
            Only with `has_existing_student_number: true`: required then, in `YYYY-MM-NNNNN` format,
            and unique ("This student number is already in use." on 422). Sending it without the
            flag is refused with 422 rather than ignored. The assigned or kept number is returned
            as `student_number` on the created profile.
        program_id:
          type: integer
        year_level:
          type: integer
          minimum: 1
          maximum: 4
        student_type:
          type: string
          description: >
            Chosen by Admission on the form (stakeholder Doc 20). `enrollment_category` and `address`
            are refused with 422: the system decides Regular or Irregular (a new account starts
            Regular) and the address text is written from `street_barangay`, `town_city` and `province`. The form offers Freshman,
            Transferee, Returnee and Existing Student.
          enum: [freshman, transferee, returnee, existing_student]
        financial_status:
          type: [string, 'null']
          enum: [scholar, payee, null]
        privacy_notice_acknowledged:
          type: boolean
          const: true
          description: >
            Admission confirms the applicant was shown the Data Privacy Notice, could read it and ask questions,
            and agreed (ADR 0055). Required; refused with 422 when absent or false. Recorded against the new
            account as an `assisted` agreement in the same transaction. The student still agrees themself the
            first time they sign in, unless they agree on the account-setup page.
        privacy_notice_version:
          type: string
          description: Required. The version of the notice that was shown; must be the current version.
    UpdateStudentProfileRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - identity_verified_in_person
      properties:
        first_name:
          type: string
          maxLength: 255
        middle_name:
          type: [string, 'null']
          maxLength: 100
          description: >
            The student's full middle name. The server derives the initial from it;
            every display of the name shows only that initial (ADR 0053).
        last_name:
          type: string
          maxLength: 255
        suffix:
          type: [string, 'null']
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 255
        gender:
          type: string
          enum: [M, F]
        birth_date:
          type: string
          format: date
        citizenship:
          type: string
          maxLength: 100
        contact_number:
          type: string
          pattern: '^[0-9+()\-\s]{7,30}$'
        street_barangay:
          type: string
          maxLength: 255
          description: >
            Sending any of `street_barangay`, `town_city` or `province` rewrites the single `address`
            text from the three, once all three are known (stored or sent); until then the existing
            text is kept. `address` itself is refused with 422. A detail whose value is changed here is
            removed from `generated_fields`; one sent unchanged stays in it.
        town_city:
          type: string
          maxLength: 255
        province:
          type: string
          maxLength: 255
        student_number:
          type: string
          maxLength: 255
          pattern: '^\d{4}-(0[1-9]|1[0-2])-\d{5}$'
        program_id:
          type: integer
        entry_year:
          type: integer
          minimum: 1000
          maximum: 9999
        year_level:
          type: integer
          minimum: 1
          maximum: 4
        student_type:
          type: string
          enum: [freshman, transferee]
        financial_status:
          type: [string, 'null']
          enum: [scholar, payee, null]
        admission_status:
          type: string
          enum: [pending, admitted, enrolled, graduated, withdrawn]
        reason:
          type: string
          maxLength: 1000
        identity_verified_in_person:
          type: boolean
          const: true
