      description: >
        Locks the current roster and grade rows in one transaction, validates
        that every enrolled student has a subject-valid mark, and transitions
        every draft grade to submitted using one submission time. Empty or
        incomplete rosters fail atomically. Repeating an already submitted or
        locked complete sheet is idempotent.
