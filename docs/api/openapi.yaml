    StoreTransfereeCreditRequest:
      type: object
      additionalProperties: false
      required:
        - source_institution
        - source_subject_title
        - credited_units
      properties:
        student_id:
          type: ["integer", "null"]
          description: >
            Required for a Program Chair (a student in their own college).
            Ignored for a Student, whose request is always for themselves.
        source_institution:
          type: string
          maxLength: 255
        source_subject_code:
          type: ["string", "null"]
          maxLength: 50
          description: Optional; stored as an empty string when left out.
        source_subject_title:
          type: string
          maxLength: 255
        source_grade:
          type: ["string", "null"]
          maxLength: 20
          description: >
            A free string with no equivalence rule encoded — PRD §17
            leaves cross-institution grade equivalence unresolved.
        credited_units:
          type: number
          exclusiveMinimum: 0
          maximum: 99.9
          description: One decimal place at most (for example 1.5).
        source_school_year:
          type: ["string", "null"]
          maxLength: 32
          description: Required for a Student.
        source_semester:
          type: ["string", "null"]
          maxLength: 32
          description: Required for a Student.
        subject_id:
          type: ["integer", "null"]
          description: >
            Program Chair only (prohibited for a Student). Optional — a
            transferred subject may not map onto any local subject yet.
    UpdateTransfereeCreditRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - endorse
            - decline
            - approve
            - reject
            - return
        reason:
          type: ["string", "null"]
          maxLength: 1000
          description: Required exactly when action is decline, reject or return.
        source_institution:
          type: string
          description: Prohibited when action is approve, reject, decline or return.
        source_subject_code:
          type: ["string", "null"]
          description: Prohibited when action is approve, reject, decline or return.
        source_subject_title:
          type: string
          description: Prohibited when action is approve, reject, decline or return.
        source_grade:
          type: ["string", "null"]
          description: Prohibited when action is approve, reject, decline or return.
        source_school_year:
          type: ["string", "null"]
          description: Prohibited when action is approve, reject, decline or return.
        source_semester:
          type: ["string", "null"]
          description: Prohibited when action is approve, reject, decline or return.
        credited_units:
          type: number
          exclusiveMinimum: 0
          maximum: 99.9
