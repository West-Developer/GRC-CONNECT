        - is_freshman
        - is_transferee
        - ticket_number
        - queue_date
        - status
        - status_label
        - priority
        - priority_label
        - created_at
        - served_at
        - requeued_at
      properties:
        type:
          type: string
          const: queue_ticket
        id:
          type: integer
        enrollment_id:
          type: [integer, 'null']
          description: >
            Null for a freshman who took a queue number at Admission, or a
            transferee whose credit mapping closed, and has no enrollment yet
            (ADR 0043).
        student_id:
          type: integer
          description: The student profile; always present.
        student_number:
          type: string
        is_freshman:
          type: boolean
          description: >
            Lets the Cashier see that the person being served is a freshman.
        is_transferee:
          type: boolean
          description: >
            Lets the Cashier see that the person being served is a transferee,
            who also pays first (ADR 0043, amended 2026-10-05).
        ticket_number:
          type: string
          description: >
            Resets daily (Q001, Q002, ...) — PRD §17 leaves the exact
            numbering scheme unconfirmed.
        queue_date:
          type: string
          format: date
        status:
          type: string
          enum:
            - waiting
            - serving
            - served
            - cancelled
        status_label:
          type: string
        priority:
          type: string
          enum:
            - regular
            - priority
        priority_label:
          type: string
        created_at:
          type: string
          format: date-time
        served_at:
          type: ["string", "null"]
          format: date-time
        requeued_at:
          type: ["string", "null"]
          format: date-time
    UpdateQueueTicketRequest:
      type: object
      additionalProperties: false
      required:
