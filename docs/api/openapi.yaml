            official grading scale unconfirmed.
        remarks:
          type: ["string", "null"]
        status:
          type: string
          enum:
            - draft
            - submitted
            - locked
        status_label:
          type: string
        submitted_at:
          type: ["string", "null"]
          format: date-time
        locked_at:
          type: ["string", "null"]
          format: date-time
    StoreAcademicGradeRequest:
      type: object
      additionalProperties: false
      required:
        - student_id
        - subject_id
        - section_id
        - academic_term_id
      properties:
        student_id:
          type: integer
        subject_id:
          type: integer
        section_id:
          type: integer
        academic_term_id:
          type: integer
        final_grade:
          type: ["number", "null"]
          minimum: 0
          maximum: 999.99
        remarks:
          type: ["string", "null"]
    UpdateAcademicGradeRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - submit
            - lock
        final_grade:
          type: ["number", "null"]
          minimum: 0
          maximum: 999.99
          description: Prohibited when action is submit or lock.
        remarks:
          type: ["string", "null"]
          description: Prohibited when action is submit or lock.
    SectionGradeSummariesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SectionGradeSummaryResource"
    SectionGradeSheetResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SectionGradeSheetResource"
    SectionGradeSummaryResource:
      type: object
      additionalProperties: false
      required:
        - type
        - section_id
        - section_code
        - subject
        - academic_term
        - schedule
        - enrolled_count
        - recorded_count
        - submitted_count
        - locked_count
        - missing_count
        - state
      properties:
        type: { type: string, const: grade_section_summary }
        section_id: { type: integer, minimum: 1 }
        section_code: { type: string }
        subject:
          type: object
          additionalProperties: false
          required: [id, code, title, is_completion_only]
          properties:
            id: { type: integer, minimum: 1 }
            code: { type: string }
            title: { type: string }
            is_completion_only: { type: boolean }
        academic_term:
          type: object
          additionalProperties: false
          required: [id, school_year, semester]
          properties:
            id: { type: integer, minimum: 1 }
            school_year: { type: string }
            semester: { type: string }
        schedule:
          type: object
          additionalProperties: false
          required: [days, starts_at_time, ends_at_time]
          properties:
            days: { type: [string, "null"] }
            starts_at_time: { type: [string, "null"] }
            ends_at_time: { type: [string, "null"] }
        enrolled_count: { type: integer, minimum: 0 }
        recorded_count: { type: integer, minimum: 0 }
        submitted_count: { type: integer, minimum: 0 }
        locked_count: { type: integer, minimum: 0 }
        missing_count: { type: integer, minimum: 0 }
        state:
          type: string
          enum: [not_started, in_progress, ready, submitted, locked]
    SectionGradeSheetResource:
      type: object
      additionalProperties: false
      required: [type, section, rows]
      properties:
        type: { type: string, const: section_grade_sheet }
        section:
          $ref: "#/components/schemas/SectionGradeSummaryResource"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SectionGradeRowResource"
    SectionGradeRowResource:
      type: object
      additionalProperties: false
