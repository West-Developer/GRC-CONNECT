        last_name:
          type: string
        suffix:
          type: [string, 'null']
          maxLength: 20
        email:
          type: string
          format: email
        address:
          type: [string, 'null']
          description: Null when the official profile has no address on file yet.
    StudentProfileRequestedIdentityFields:
      type: object
