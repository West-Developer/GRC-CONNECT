    AuditLog:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - actor_user_id
        - actor_name
        - actor_role
        - actor_role_label
        - acting_role
        - acting_role_label
        - acting_college
        - action
        - auditable_type
        - auditable_id
        - before_values
        - after_values
        - changes
        - reason
        - request_id
        - ip_address
        - created_at
      properties:
        type:
          type: string
          const: audit_log
        id:
          type: integer
          minimum: 1
        actor_user_id:
          type: integer
          minimum: 1
        actor_name:
          type: string
          description: Registrar Head only; email addresses are never returned.
        actor_role:
          type: string
          enum:
            - student
            - admission_staff
            - faculty
            - program_chair
            - dean
            - executive_director
            - registrar_head
            - registrar_staff
            - accounting_staff
            - queue_kiosk
            - super_admin
        actor_role_label:
          type: string
        acting_role:
          type:
            - string
            - "null"
        acting_role_label:
          type:
            - string
            - "null"
        acting_college:
          type:
            - string
            - "null"
        action:
          type: string
        auditable_type:
          type: string
        auditable_id:
          type:
            - integer
            - "null"
          minimum: 1
        before_values:
          type:
            - object
            - "null"
          additionalProperties: true
        after_values:
          type:
            - object
            - "null"
          additionalProperties: true
        changes:
          type: array
          description: >
            Readable field-by-field comparison of the two snapshots. `changed`
            is false for a field that kept its value. Professor and decider
            ids are shown as names; any field whose key looks like a name,
            email, password, token, or secret is shown as `Hidden`.
          items:
            type: object
            additionalProperties: false
            required: [field, label, old, new, changed]
            properties:
              field:
                type: string
              label:
                type: string
              old: {}
              new: {}
              changed:
                type: boolean
        reason:
          type:
            - string
            - "null"
        request_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          maxLength: 128
        ip_address:
          type:
            - string
            - "null"
          maxLength: 45
        created_at:
          type:
            - string
            - "null"
          format: date-time
    AuditActor:
      type: object
      additionalProperties: false
      required:
