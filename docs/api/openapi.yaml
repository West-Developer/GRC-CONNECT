          type: string
          const: auth-session
        token:
          type: string
          description: Plain-text bearer token. Shown only once, on this response.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: >
            PROVISIONAL — derived from a local development default pending
