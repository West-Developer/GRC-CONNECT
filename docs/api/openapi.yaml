        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/student-profiles/{studentProfile}/freshman-payment:
    post:
      operationId: postStudentProfileFreshmanPayment
      summary: Confirm a freshman's or transferee's first payment
      description: >
        Accounting Staff only (ADR 0043, amended 2026-10-04 and 2026-10-05).
        One transaction, for a freshman or a transferee. The amount must be
        at least the configured minimum (PHP 1,000.00) and never needs a
        promissory note; the unpaid balance stays on the student's account.
        The money is always held as advance credit first and the queue ticket
        is served. The payment does not enroll anyone: a freshman with a block
        that has open seats is submitted to it, and a transferee's own
        enrollment moves from `awaiting_first_payment` to
        `pending_registrar_approval`; Registrar Staff approval then enrolls
        them from the held credit, makes the COR and sends the one enrollment
        confirmation email. Otherwise (every section full or an Irregular
        freshman; a transferee who has not chosen subjects yet) the payment
        stays held and the student is told what happens next. After commit a
        freshman's account setup invitation is emailed (a transferee already
        has an account). Idempotent on
        `student_profiles.freshman_payment_confirmed_at`, the key for both
        types: a repeat answers 200 with the same result and changes and sends
        nothing. Refused (422) below the minimum, or for a student who does
        not pay first.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: studentProfile
          in: path
          required: true
          description: Student profile ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmFreshmanPaymentRequest"
      responses:
        "200":
          description: The payment was already confirmed; nothing changed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreshmanPaymentResponse"
        "201":
          description: The payment was confirmed now.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreshmanPaymentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No student profile exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
