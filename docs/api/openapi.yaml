          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments:
    get:
      operationId: getEnrollments
      summary: List enrollments (role-scoped)
      description: >
        Role-scoped per FR-FIN-001/005 (see App\Models\Enrollment::scopeVisibleTo):
        a Student sees only their own enrollments; the Registrar Head sees
        every enrollment (the approval queue), filterable by `status` and
        `academic_term_id` and paginated; Accounting Staff sees only
        `pending_payment` enrollments regardless of any `status` filter
        supplied — that restriction is an authorization boundary
        (`EnrollmentPolicy`), not merely a display filter.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - pending_program_head_approval
              - pending_student_review
              - awaiting_first_payment
              - pending_registrar_approval
              - pending_payment
              - enrolled
              - rejected
              - cancelled
              - withdrawn
        - name: academic_term_id
          in: query
          required: false
          description: Existing academic term primary key.
          schema:
            type: integer
            minimum: 1
        - name: enrollment_ids[]
          in: query
          required: false
          description: Exact enrollment IDs to hydrate for the visible Cashier tickets; role visibility still applies.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              type: integer
              minimum: 1
        - name: without_queue_ticket
          in: query
          required: false
          description: Use `1` to list only enrollments without a queue ticket; this read never issues a ticket.
          schema:
            type: boolean
        - name: current_term
          in: query
          required: false
          description: Use `1` to restrict results to the ongoing academic term.
          schema:
            type: boolean
        - name: exceeds_unit_maximum
          in: query
          required: false
          description: >
            `1` keeps only the enrollments whose load is over the unit maximum they
            were measured against (an irregular student may submit one after
            confirming; the Program Chair then corrects it). `0` or absent leaves
            the list unfiltered.
          schema:
            type: boolean
        - name: per_page
          in: query
          required: false
          description: Number of enrollments per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The role-scoped, paginated enrollment list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEnrollmentCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createEnrollment
      summary: Submit an enrollment (DFD 2.4)
      description: >
        Own-record only — Student role only. Atomically creates one
        enrollment, its enrollment subjects, one queue ticket, one audit
        entry, and a confirmation notification (FR-ENR-007–009). Every
        submitted section is re-validated server-side against a freshly
        built eligible-subject pool — the client's pool view is advisory
        only. Rejects a duplicate active enrollment for the term, a
        duplicate subject across two sections, sections that conflict on
        schedule with each other, and (only when
        `enrollment.max_regular_units` is configured — PRD §17 pending) a
        total load over the configured cap.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEnrollmentRequest"
      responses:
        "201":
          description: The created enrollment.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation failed — a duplicate active enrollment, an ineligible,
            duplicate-subject, or schedule-conflicting section, or (when
            configured) an overload.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments/{enrollment}:
    patch:
      operationId: patchEnrollment
      summary: Apply one Registrar Head decision to an enrollment
      description: >
        No `role:` middleware gates this route — `program_head_approve` /
        `program_head_reject` (the Program Head's first step for an irregular
        or overload enrollment, own college only), `registrar_approve` and
        `registrar_reject` (the Registrar Staff / Registrar Head checkpoint
        for every enrollment, ADR 0030; allowed from
        `pending_registrar_approval` and, since 2026-10-03, from an approved
        but unpaid `pending_payment` enrollment, where it releases the seats
        and cancels a waiting queue ticket) and `void` (a
        later, distinct checkpoint: cancelling an already-approved but unpaid
        enrollment) are each resolved by EnrollmentPolicy per request (see
        ADR 0011). `reason` is required exactly for `registrar_reject` and
        `void` (FR-FIN-002) and is recorded only in the audit row, since
        `enrollments` has no `decision_reason` column of its own.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: enrollment
          in: path
          required: true
          description: Enrollment ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnrollmentRequest"
      responses:
        "200":
          description: The transition was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the action does not match the
            enrollment's current status, or a required reason is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments/{enrollment}/payment:
    post:
      operationId: postEnrollmentPayment
      summary: Confirm an externally received payment and generate the Digital COM
      description: >
        Accounting Staff only, and only from `pending_payment`
        (FR-FIN-007/008). One transaction: a `Payment` row, the enrollment's
        own transition to `enrolled`, and the Digital COM
        (`EnrollmentDocument`, type `com`). Idempotent (FR-FIN-009): a
        repeat call — even one arriving after the enrollment has already
        moved on to `enrolled` — returns the existing payment and document
        rather than erroring or duplicating either, and receives `200`
        instead of `201`. No PDF pipeline: `document_number` is an opaque
        deterministic string and `storage_path` stays null; FR-FIN-010's
        print/download is served by the Student module rendering the
        structured response as a print-stylesheet page.

        Full-payment discount (ADR 0046): with `payment_type: full` and the `quoted_amount`
        the Cashier was shown (`GET /enrollments/{enrollment}/payment-quote`), the discount line
        is written in the same transaction and the payment collects the net. If the server's
        figure no longer equals `quoted_amount`, the request is refused with 422 on
        `quoted_amount` and nothing is written. An installment, and a request with no
        `payment_type`, carry no discount and no extra fee.

        Promissory note (ADR 0047): `promissory_note_on_file` is required (422) only when the
        `amount` is below the term's assessment AND the student has a previous bill, an unpaid
        balance on another of their enrollments. A downpayment with nothing owed from before
        needs no note.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: enrollment
          in: path
          required: true
          description: Enrollment ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentRequest"
      responses:
        "200":
          description: >
            An already-confirmed payment — the existing payment and
            document are returned unchanged (idempotent repeat call).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmationResponse"
        "201":
          description: The payment was confirmed and the Digital COM generated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, or the enrollment is not
            currently `pending_payment` and has no existing payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments/{enrollment}/payment-quote:
    get:
      operationId: getEnrollmentPaymentQuote
      summary: Quote what paying in full would collect
      description: >
        Accounting Staff only (ADR 0046). For an enrollment that is `pending_payment` and has an
        assessment: the amount due before any full-payment discount (`total_amount`) and what a
        full payment collects. `net_total` is always what a full payment collects, discounted
        when `applies` is true. When no discount applies, `percentage` and `discount_amount` are
        null and `reason` is one of `off`, `scheduled`, `expired`, `scholar`. Writes nothing.
        Refused (422, error key `enrollment`) for any other enrollment state or an enrollment
        with no assessment.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: enrollment
          in: path
          required: true
          description: Enrollment ID.
          schema:
            type: integer
      responses:
        "200":
          description: The quote.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentQuoteResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The enrollment is not pending payment or has no assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/payment-discount-settings:
    get:
      operationId: getPaymentDiscountSettings
      summary: Read the full-payment discount setting
      description: >
        Registrar Head and Accounting Staff (ADR 0046). The one setting row, created at the
        configured default (10.0%) on first read; the response is `200` even when this read
        created the row.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The setting.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDiscountSettingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putPaymentDiscountSettings
      summary: Change the full-payment discount percentage and validity
      description: >
        Registrar Head only (ADR 0046). `percentage` is 0 to 100 with at most one decimal; 0 turns
        the discount off. `valid_from` and `valid_until` are inclusive `Y-m-d` dates in the school's
        calendar (Asia/Manila); both keys must be sent and `null` clears a date. `valid_until`
        cannot be before `valid_from`. Audited as `payment_discount.updated`; a save that changes
        nothing writes no audit row. Existing assessments, payments and CORs are never changed.
      security:
