              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/queue-view/{token}:
    get:
      operationId: getPublicQueueView
      summary: Read a freshman's or transferee's live queue view from their emailed link
      description: >
        No sign-in (ADR 0044). The 48-character token in the path is the
        credential: it identifies exactly one queue ticket, issued to a
        freshman at Admission (or to a transferee when their credit mapping
        closes), and only its SHA-256 is stored. Returns the
        same ticket-number-only shape as the signed-in Student's view with
        stage `freshman_awaiting_payment` / `freshman_paid` or
        `transferee_awaiting_payment` / `transferee_paid` (and `transferee_enrolled`
        once the Registrar has approved them); it never returns
        a name, e-mail or student number. An unknown or malformed token is a
        plain 404. Rate limited per link (40 a minute) with a generous
        per-address ceiling.
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: token
          in: path
          required: true
          description: The secret from the emailed link.
          schema:
            type: string
            pattern: "^[A-Za-z0-9]{48}$"
      responses:
        "200":
          description: The live queue view for that freshman's ticket.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQueueViewResponse"
        "404":
          description: The token is not known (it never existed or was replaced).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queue-status:
    get:
      operationId: getStudentQueueStatus
      summary: Read the authenticated Student's live queue view
      description: >
        Student only. Returns the caller's own queue state and ticket plus
