                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - section_code
                        - first
                        - second
                        - reason
                        - days
                        - message
                      properties:
                        section_code:
                          type: string
                        first:
                          type: object
                          properties:
                            section_id:
                              type: integer
                            subject_code:
                              type: string
                        second:
                          type: object
                          properties:
                            section_id:
                              type: integer
                            subject_code:
                              type: string
                        reason:
                          type: string
                          enum:
                            - no_shared_day
                            - not_back_to_back
                        days:
                          type: array
                          items:
                            type: string
                        message:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
