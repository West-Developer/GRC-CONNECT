  /api/v1/transferee-credits/{transfereeCredit}:
    patch:
      operationId: patchTransfereeCredit
      summary: Edit a draft (Student); map, endorse or decline a credit (Program Chair); approve, reject or return it (Registrar Head)
      description: >
        No `role:` middleware — TransfereeCreditPolicy resolves the ability
        (ADR 0026, amended). A Student may only correct the content of their
        own `draft` (no `action`, no `subject_id`). A Program Chair may only
        act on a credit of a student in their own college and never sees a
        draft. With no `action`, the Program Chair edits or maps a credit,
        allowed only while it is `pending`. `action: endorse` (Program Chair,
        `pending` → `endorsed`) needs a mapped subject, which the same request
        may set through `subject_id`, notifies the Registrar Head, and clears
        any earlier return. `action: decline` (Program Chair, `pending` →
        `rejected`) requires a reason and notifies the Student. `action:
        approve`, `reject` or `return` is the Registrar Head only and requires
        the credit to currently be `endorsed`; `reject` and `return` require a
        reason. `return` sends the credit back to `pending`, records who, when
        and why, and notifies the Program Chairs of the student's college. A
        reason is recorded in the audit row. Each step re-checks the status
        under a row lock, so a repeated request changes nothing a second time.
        An approved credit that is mapped to a subject counts as credited for
        eligibility, standing, promotion and the prospectus; it carries no
        GRC grade. Every write is audited (FR-FIN-003).
      security:
        - bearerAuth: []
      tags:
        - Transferee Credits
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: transfereeCredit
          in: path
          required: true
          description: Transferee credit ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransfereeCreditRequest"
      responses:
        "200":
          description: The edit or decision was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransfereeCreditResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No transferee credit exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the credit is no longer
            editable, or the action does not match the credit's current
            status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTransfereeCredit
      summary: Remove a subject from the student's saved list
      description: >
        Student only, and only the student's own credit while it is still a
        `draft`. A credit that has been sent is part of the workflow and is
        never deleted (422). Audited as `transferee_credit.deleted`.
      security:
        - bearerAuth: []
      tags:
        - Transferee Credits
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: transfereeCredit
          in: path
          required: true
          description: Transferee credit ID.
          schema:
            type: integer
      responses:
        "204":
          description: The draft was removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No transferee credit exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The credit is no longer a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transferee-credits/{transfereeCredit}/suggestions:
    get:
      operationId: getTransfereeCreditSuggestions
      summary: Suggested subjects for a credit (Program Chair)
      description: >
        Program Chair only, and only for a credit of a student in their own
        college. Up to five subjects of the student's own curriculum that the
        credit could be mapped to, best match first, scored on subject code,
        title and units. Subjects the student already passed, is credited
        with, or has mapped through another open or approved credit are left
        out. Advice only: computed on every request, never stored, and never
        written to `subject_id` — the mapping is the Program Chair's
        decision (ADR 0026).
      security:
        - bearerAuth: []
      tags:
        - Transferee Credits
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: transfereeCredit
          in: path
          required: true
          description: Transferee credit ID.
          schema:
            type: integer
      responses:
        "200":
          description: The ranked suggestions (possibly empty).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditSubjectSuggestionsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No transferee credit exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/student-profiles/{studentProfile}/transferee-credits/suggestions:
    get:
      operationId: getStudentCreditMappingSuggestions
      summary: Suggestions for every pending credit of a student, and their curriculum (Program Chair)
      description: >
        Program Chair only, and only for a student of their own college (a Chair
        with no assigned college is unscoped). For the side-by-side mapping
        screen (ADR 0026, amended): `credits` has one entry per `pending` credit
        of the student (never a draft or a decided credit), each with the same
        ranked suggestions the per-credit endpoint gives, computed together so
        the cost does not grow with the number of subjects; `curriculum_subjects`
        are the active subjects of the student's own curriculum to choose from,
        one per subject, ordered by year level, semester and code. Advice only:
        computed on every request, never stored, never written to `subject_id`.
      security:
        - bearerAuth: []
      tags:
        - Transferee Credits
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: studentProfile
          in: path
          required: true
          description: Student profile ID.
          schema:
            type: integer
      responses:
        "200":
          description: The suggestions per pending credit and the curriculum subjects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCreditMappingWorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No student profile exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/student-profiles/{studentProfile}/transferee-credits/submit-to-registrar-head:
    post:
      operationId: postStudentCreditsSubmitToRegistrarHead
      summary: Send a whole student to the Registrar Head (Program Chair)
      description: >
        Program Chair only, and only for a student of their own college. Every
        `pending` credit of the student becomes `endorsed` (with `endorsed_by`
        and `endorsed_at`, clearing any earlier return) in one transaction, and
        the Registrar Head gets one notice with the count. All or nothing: if
        any pending credit still has no mapped subject, nothing is endorsed and
        the answer is 422 with the credits still unmapped in `errors.credits`
        (a credit with no equivalent is declined first, which makes it
        `rejected`). Idempotent: a repeat finds no pending credit, changes
        nothing, notifies nobody, and answers 200 with an empty `data`. Each
        endorsement is audited (`transferee_credit.endorsed`).
      security:
        - bearerAuth: []
      tags:
        - Transferee Credits
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: studentProfile
          in: path
          required: true
          description: Student profile ID.
          schema:
            type: integer
      responses:
        "200":
          description: The credits this call endorsed (empty when nothing was pending).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittedTransfereeCreditsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No student profile exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: A pending credit has no mapped subject; nothing was endorsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/student-profiles/{studentProfile}/transferee-credits/approve-all:
    post:
      operationId: postStudentCreditsApproveAll
      summary: Approve all of a student's endorsed credits (Registrar Head)
      description: >
        Registrar Head only. Every `endorsed` credit of the student becomes
        `approved` (with `processed_by` and `processed_at`) in one transaction,
        and the student gets one notice with the count. Only `endorsed` credits
        are touched: a pending credit has not been sent to the Head, a draft is
        private, a decided credit is decided. Idempotent: a repeat finds no
        endorsed credit, changes nothing, notifies nobody, and answers 200 with
        an empty `data`. Each approval is audited
        (`transferee_credit.approved`). An approved credit that is mapped to a
        subject counts as credited; it carries no GRC grade.
      security:
        - bearerAuth: []
      tags:
        - Transferee Credits
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: studentProfile
          in: path
          required: true
          description: Student profile ID.
          schema:
            type: integer
      responses:
        "200":
          description: The credits this call approved (empty when nothing was endorsed).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittedTransfereeCreditsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No student profile exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
