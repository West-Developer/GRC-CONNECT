  /api/v1/analytics/attrition:
    get:
      operationId: getAttritionReport
      summary: Get aggregate first-to-second semester attrition
      description: >
        Attrition means students who will not continue (stakeholder Doc 14).
        Of the students enrolled in the baseline term, `retained` enrolled in
        the comparison term; `attrited` withdrew, or did not enroll in the
        comparison term after its enrollment window closed (`enrollment_closes_at`,
        else the add/drop deadline, else a closed or archived term). Graduates
        (`graduated_count`) and students still deciding or enrolling
        (`undecided_count`: no enrollment yet while the window is open, or an
        enrollment in progress) are left out of `baseline_count` and are never
        counted as attrition. Predictive attrition risk stays advisory.
      security: [{ bearerAuth: [] }]
      tags: [Analytics]
      parameters:
        - { name: baseline_academic_term_id, in: query, required: true, schema: { type: integer } }
        - { name: comparison_academic_term_id, in: query, required: true, schema: { type: integer } }
        - { name: college, in: query, schema: { type: [string, "null"] } }
        - { name: program_id, in: query, schema: { type: [integer, "null"] } }
        - { name: year_level, in: query, schema: { type: [integer, "null"] } }
      responses:
        "200": { description: Aggregate-only report, headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/analytics/enrollment-movements:
    get:
      operationId: getEnrollmentMovements
      summary: Drops, withdrawals, or course shifts for one term
      description: >
        Registrar Head, Registrar Staff, and Program Head (own college only),
        stakeholder Doc 14 / ADR 0034. Aggregate counts only, no student is
        identified. `drops` counts approved drop requests, `withdrawals`
        approved withdrawal requests (distinct students, per course of study),
        and `shifts` recorded course shifts grouped from course to course. A
        Program Head sees a shift out of, or into, their own college.
      security:
        - bearerAuth: []
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: academic_term_id
          in: query
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [drops, withdrawals, shifts]
        - name: college
          in: query
          required: false
          description: Registrar roles only; a Program Head is always limited to their own college.
          schema:
            type: string
            enum: [ccs, coe, coa, cbae]
      responses:
        "200":
          description: The counts.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, movement, academic_term_id, total, by_department, groups]
                    properties:
                      type:
                        type: string
                        const: enrollment_movements
                      movement:
                        type: string
                        enum: [drops, withdrawals, shifts]
                      academic_term_id:
                        type: integer
                      total:
                        type: integer
                      by_department:
                        type: array
                        items:
                          type: object
                          required: [college, label, count]
                          properties:
                            college:
                              type: string
                            label:
                              type: string
                            count:
                              type: integer
                      groups:
                        type: array
                        items:
                          type: object
                          required: [label, count, from_program_code, to_program_code]
                          properties:
                            label:
                              type: string
                            count:
                              type: integer
                            from_program_code:
                              type: ["string", "null"]
                            to_program_code:
                              type: ["string", "null"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The term or type is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
