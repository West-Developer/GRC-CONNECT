        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No section exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the section code is already used
            for this subject and term, or the assigned professor would be
            double-booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sections/{section}/professor:
    put:
      operationId: putSectionProfessor
      summary: Assign or remove the professor of a section
      description: >
        Dean only, for sections their own college planned (ADR 0033). Changes
        the professor and nothing else about the section. `professor_id` is
        required and may be null to remove the professor. The professor must
        be a Faculty user of the same college who is not already teaching at
        that time. It needs no approval, even for a published section, but the
        Registrar Head is notified and the audit record is
        `section.professor_reassigned`. Assigning who is already assigned
        changes nothing. A section that came from a schedule generation run
        needs `override_reason`.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: section
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [professor_id]
              properties:
                professor_id:
                  type: ["integer", "null"]
                override_reason:
                  type: ["string", "null"]
                  maxLength: 1000
      responses:
        "200":
          description: The section after the change.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No section exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The professor is double-booked, belongs to another college, or a reason is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/sections/{section}/change-requests:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: section
        in: path
        required: true
        description: Section ID.
        schema:
          type: integer
    post:
      operationId: createSectionChangeRequest
      summary: Ask the Registrar Head to change a published section
      description: >
        Program Head only (ADR 0032). A published section is final: PATCH
        /sections/{section} refuses any change except the professor, so the
        schedule is changed by filing this request. Only `schedule_days`,
        `starts_at_time`, `ends_at_time`, `room`, `modality`, `capacity`, and
        `viability_threshold` may be requested. The request is refused when
        nothing differs, when the proposed slot clashes with another class,
        or when a request for the section is already pending. The Registrar
        Head is notified.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSectionChangeRequestRequest"
      responses:
        "201":
          description: The pending change request.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/SectionChangeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No section exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The request is invalid, changes nothing, clashes with another class, or one is already pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/section-change-requests:
    get:
      operationId: listSectionChangeRequests
      summary: List section change requests
      description: >
        Registrar Head sees every request. A Program Head sees the requests
        for their own college's sections plus any they filed. Pending first,
        then newest first; at most 200.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
        - name: section_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The visible change requests.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectionChangeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The status or section filter is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/section-change-requests/{sectionChangeRequest}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: sectionChangeRequest
        in: path
        required: true
        description: Change request ID.
        schema:
          type: integer
    patch:
      operationId: decideSectionChangeRequest
      summary: Approve, reject, or withdraw a section change request
      description: >
        `approve` and `reject` are the Registrar Head's; `cancel` is the
        Program Head who filed a still-pending request. Approving re-checks
        that the section is still published and unchanged since the request
        and that the new slot does not clash, then applies the change and the
        decision in one transaction. Rejecting requires `decision_reason`.
        Repeating a decision on an already-decided request returns it
        unchanged; the opposite decision is refused with 422.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideSectionChangeRequestRequest"
      responses:
        "200":
          description: The request after the decision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/SectionChangeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No change request exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: A reason is missing, the request was already decided the other way, or it can no longer be applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/schedule-proposals:
    get:
      operationId: getScheduleProposals
      summary: List schedule proposals visible to the authenticated role
      description: >
        Learner-scoped roles receive only `published`/`closed` proposals;
        every other role receives every proposal regardless of status.
        Ordered by term descending, then most recently created first.
      security:
        - bearerAuth: []
      tags:
        - Approval Workflow
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The schedule proposals visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleProposalsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postScheduleProposal
      summary: Submit a schedule proposal for a term
      description: >
        Program Chair only. Always created in `draft`. Rejected if the term
        already has a non-`closed` proposal.
      security:
        - bearerAuth: []
      tags:
        - Approval Workflow
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreScheduleProposalRequest"
      responses:
        "201":
          description: The proposal was submitted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleProposalResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, or this term already has an
            active (non-closed) proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/schedule-proposals/{scheduleProposal}:
    patch:
      operationId: patchScheduleProposal
      summary: Apply one transition to a schedule proposal
      description: >
        No `role:` middleware gates this route — the six possible `action`
        values each require a different role, resolved by
        ScheduleProposalPolicy per request (see ADR 0011):
        `dean_approve`/`dean_return` (Dean), `executive_approve`/
        `executive_return`/`publish` (Executive Director), `close`
        (Registrar Head). `decision_reason` is required exactly for
        `dean_return` and `executive_return`. `publish` also
        bulk-transitions the term's `planned` sections to `published`.
      security:
        - bearerAuth: []
      tags:
        - Approval Workflow
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleProposal
          in: path
          required: true
          description: Schedule proposal ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleProposalRequest"
      responses:
        "200":
          description: The transition was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleProposalResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No schedule proposal exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the action does not match the
            proposal's current status, or a required decision reason is
            missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/schedule-proposals/{scheduleProposal}/sections:
    get:
      operationId: getScheduleProposalSections
      summary: View the department schedule attached to one proposal
      description: >
        Returns the read-only subject schedules for the proposal's academic
        term and college. Dean and Executive Director use this detail before
        approving or returning a Program Chair submission. A college-scoped
        Program Chair may view only their own college proposal.
      security:
        - bearerAuth: []
      tags:
        - Approval Workflow
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleProposal
          in: path
          required: true
          description: Schedule proposal ID.
          schema:
            type: integer
      responses:
        "200":
          description: The submitted department schedule.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleReviewSectionsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No schedule proposal exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/student-profiles:
    get:
      operationId: getStudentProfiles
      summary: Search the Admission student directory
      description: >
        Admission Staff only. Returns a paginated directory searchable by
        student name, student number, or email. Responses include no password,
        setup code, or reset-token data. The directory can be narrowed to one
        student type and to where the account stands (the Freshmen view,
        ADR 0052): `account_setup_status` matches the status each row reports.
      security:
        - bearerAuth: []
      tags:
        - Student Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: student_type
          in: query
          required: false
          schema:
            type: string
            enum: [freshman, transferee, returnee, existing_student]
        - name: intake
          in: query
          required: false
          description: >
            `pay_first`: only students Admission is processing through the
            pay-first intake (they hold a queue number, or the Cashier has
            confirmed their first payment), newest first. Historical records
            are left out. Without it the directory lists everyone by student
            number.
          schema:
            type: string
            enum: [pay_first]
        - name: account_setup_status
          in: query
          required: false
          description: >
            `active`: the student set the account up. `awaiting_payment`: a
            freshman whose first payment the Cashier has not confirmed (no
            setup email yet). `pending`: every other account still to be set
            up.
          schema:
            type: string
            enum: [awaiting_payment, pending, active]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of matching student records.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStudentProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The search or pagination parameters failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postStudentProfile
      summary: Provision a student account and initial profile
      description: >
        Admission Staff only. Requires an address and an explicit attestation
        that requirements were submitted. Creates the disabled Student User
        and StudentProfile atomically, resolves the curriculum from program
        and entry year, then attempts delivery of a one-time account-setup
        email. No client password or curriculum override is accepted.
      security:
        - bearerAuth: []
      tags:
        - Student Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreStudentProfileRequest"
      responses:
        "201":
          description: The student account and profile were created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, the email or student number is
            already taken, or no curriculum covers the program and entry year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/students/{studentProfile}/subject-waivers:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: studentProfile
        in: path
        required: true
        description: Student profile ID.
        schema:
          type: integer
    get:
      operationId: listStudentSubjectWaivers
      summary: List a student's prerequisite waivers and blocked subjects for one term
      description: >
        Registrar Head only (ADR 0031). `data` is every waiver for the student
        and term, active and revoked; `meta.blocked_subjects` lists the
        subjects the student is blocked from only because of an unmet
        prerequisite, which is what a waiver can lift.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - name: academic_term_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The waivers and the blocked subjects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubjectWaiver"
                  meta:
                    type: object
                    required:
                      - blocked_subjects
                    properties:
                      blocked_subjects:
                        type: array
                        items:
                          type: object
                          required:
                            - subject_id
                            - subject_code
                            - subject_title
                            - reasons
                          properties:
                            subject_id:
                              type: integer
                            subject_code:
                              type: string
                            subject_title:
                              type: string
                            reasons:
                              type: array
                              items:
                                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: grantStudentSubjectWaiver
      summary: Waive an unmet prerequisite for one subject and term
      description: >
        Registrar Head only (ADR 0031). `reason` is required and audited. The
        subject must be in the student's curriculum. Idempotent: `201` when a
        waiver is created or re-activated, `200` when it was already active.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - subject_id
                - academic_term_id
                - reason
              properties:
                subject_id:
                  type: integer
                academic_term_id:
                  type: integer
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
      responses:
        "200":
          description: The waiver was already active.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/SubjectWaiver"
        "201":
          description: The waiver was created or re-activated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/SubjectWaiver"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/students/{studentProfile}/subject-withdrawals:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: studentProfile
        in: path
        required: true
        description: Student profile ID.
        schema:
          type: integer
    get:
      operationId: listStudentSubjectWithdrawals
      summary: List the subjects a student can still be withdrawn from and the ones already withdrawn
      description: >
        Registrar Head only. `withdrawable` is every active subject of the
        student's `enrolled` enrollments in a term that is not closed;
        `withdrawn` is every subject already withdrawn (a locked `W` grade).
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      responses:
        "200":
          description: The withdrawable and the withdrawn subjects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectWithdrawalOverviewEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: withdrawStudentSubjects
      summary: Withdraw one or more of a student's enrolled subjects
      description: >
        Registrar Head only. Each subject is dropped from the enrollment, its
        section seat is released once, a locked `W` grade is written (it shows
        on the Prospectus as Withdrawn) and the student is notified. A subject
        that is no longer active, a locked final grade or a closed term is
        refused with 422, so a repeat changes nothing. Withdrawing the last
        active subject of an enrollment withdraws the enrollment. Fees are not
        changed.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enrollment_subject_ids
                - reason
              properties:
                enrollment_subject_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200":
          description: The overview after the withdrawal.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectWithdrawalOverviewEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/subject-waivers/{waiver}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: waiver
        in: path
        required: true
        description: Waiver ID.
        schema:
          type: integer
    delete:
      operationId: revokeSubjectWaiver
      summary: Take a prerequisite waiver back
      description: >
        Registrar Head only (ADR 0031). Revokes rather than deletes, so the
        history stays; revoking an already-revoked waiver changes nothing.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      responses:
        "200":
          description: The revoked waiver.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/SubjectWaiver"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No waiver exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/academic-terms/{academicTerm}/lecture-lab-adjacency:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: academicTerm
        in: path
        required: true
        description: Academic term ID.
        schema:
          type: integer
    get:
      operationId: listLectureLabAdjacency
      summary: Lecture/laboratory pairs that are not back-to-back
      description: >
        Program Head only, own college (stakeholder Doc 14). Review information:
        it never blocks a save or a submission. A pair is listed only when
        both sections are fully scheduled; each entry names the two subjects,
        the section code, why (`no_shared_day` or `not_back_to_back`), and the
        days that are apart.
      security:
        - bearerAuth: []
      tags:
