    post:
      operationId: postQueueTicket
      summary: Claim a payment-queue ticket
      description: >
        A Student claims only their own pending-payment ticket and must send
        an active `queue_kiosk` Sanctum token with `queue-kiosk:claim` in the
        `X-Queue-Kiosk-Token` header. Accounting Staff claims on a Student's
        behalf by supplying `student_number`; its existing request does not
        require or use that header.
