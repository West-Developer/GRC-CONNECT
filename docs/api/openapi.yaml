        - $ref: "#/components/parameters/RequestId"
        - name: X-Queue-Kiosk-Token
          in: header
          required: false
          description: >
            Required only when the bearer is a Student claiming their own
            ticket. It must be a valid active `queue_kiosk` token with the
            `queue-kiosk:claim` ability. Accounting Staff must not rely on
            this header for an on-behalf claim.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
