  /api/v1/admission-requirement-types:
    get:
      operationId: listAdmissionRequirementTypes
      summary: The Admission requirements that apply to a new student of a type
      description: >
        Admission Staff only. Feeds the Create Account checklist (stakeholder Doc 20) before a
        student record exists. The lists follow the student type Admission picked: Freshman and
        Transferee each add their own list, Returnee and Existing Student get the Additional list
        only, and Additional applies to everyone. Only active requirements are listed. `year_level`
        is still accepted for older callers and is turned into a type the old way (Year 1 Freshman,
        Years 2-4 Transferee).
      security:
        - bearerAuth: []
      tags:
        - Student Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: student_type
          in: query
          required: false
          description: Required unless `year_level` is sent.
          schema:
            type: string
            enum: [freshman, transferee, returnee, existing_student]
        - name: year_level
          in: query
          required: false
          description: Legacy alternative to `student_type`.
          schema:
            type: integer
            minimum: 1
            maximum: 4
      responses:
        "200":
          description: The requirement lists for that student type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { type: string, const: admission_requirement_selection }
                      student_type: { type: string, enum: [freshman, transferee, returnee, existing_student] }
                      student_type_label: { type: string }
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            category: { type: string, enum: [freshman, transferee, additional] }
                            label: { type: string }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  requirement_type_id: { type: integer }
                                  name: { type: string }
                                  is_system: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdmissionRequirementType
      summary: Add a requirement to the shared Admission list
      description: >
        Admission Staff only. Appears for every student of that category. A name
        already in the category is refused (ADR 0037).
      security:
        - bearerAuth: []
      tags:
        - Student Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 160
                category:
                  type: string
                  enum: [freshman, transferee, additional]
      responses:
        "201":
          description: The new requirement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { type: string, const: admission_requirement_type }
                      id: { type: integer }
                      category: { type: string }
                      name: { type: string }
                      is_system: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/reports/honors:
    get:
      operationId: getHonorsReport
      summary: Get live Dean's List qualifiers
      security: [{ bearerAuth: [] }]
      tags: [Honors]
      parameters:
        - { name: academic_term_id, in: query, required: true, schema: { type: integer } }
        - { name: college, in: query, schema: { type: [string, "null"] } }
        - { name: program_id, in: query, schema: { type: [integer, "null"] } }
        - { name: year_level, in: query, schema: { type: [integer, "null"] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated live honors report, headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/ched-reports/{report}:
    get:
      operationId: getChedReport
      summary: Preview a CHED / NSTP report for a term
      description: >
        Registrar Head only (ADR 0049). `enrollment-list` is the CHED NCR Enrollment List; `nstp-enrollment`
        is the NSTP Form 2-B list of NSTP 1 enrollees (first-semester term) or NSTP 2 enrollees (second-semester
        term); `nstp-graduates` is the Form 2-B list of NSTP 2 passers; `nstp-summary` is NSTP Form 2-A for the
        chosen term only (one fixed grid, no paging; only the term's own semester block has numbers). `report.title`
        names the NSTP subject of the term's semester. Students flagged as demo accounts are never listed. `search`
        keeps the students whose name or student number contains every word; it narrows this preview only, never
        a download. The first page of a preview writes a `ched_report.viewed` audit row (whether a search was used,
        never the words). `report.missing_gender` counts listed
        students with no gender on file and `report.demo_populated` those carrying generated details.
      security: [{ bearerAuth: [] }]
      tags: [CHED reports]
      parameters:
        - { name: report, in: path, required: true, schema: { type: string, enum: [enrollment-list, nstp-enrollment, nstp-graduates, nstp-summary] } }
        - { name: academic_term_id, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: A page of rows (or the summary grid) with the report description.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [data, report]
                properties:
                  data:
                    description: Rows keyed by the column keys of `report.columns`; for `nstp-summary` an object with campus, classification, academic_year, enrollment (1st, 2nd, summer), graduates and missing_gender, each component holding m / f counts.
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                  report:
                    type: object
                    required: [key, title, term_label, school_year, columns, missing_gender, demo_populated]
                    properties:
                      key: { type: string }
                      title: { type: string }
                      term_label: { type: string }
                      school_year: { type: string }
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string }
                            label: { type: string }
                      missing_gender: { type: integer }
                      demo_populated: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown report }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/ched-reports/{report}/export:
    get:
      operationId: exportChedReport
      summary: Download a CHED / NSTP report as CSV or as the filled CHED template (Excel)
      description: >
        Registrar Head only (ADR 0049). `xlsx` is the owner's CHED template with the rows filled in (layout,
        merged cells and logo unchanged); `csv` is the template's column headers and the rows, UTF-8 with a
        byte-order mark. Every download writes a `ched_report.exported` audit row (report, term, format, row
        count). The response is `private, no-store`.
      security: [{ bearerAuth: [] }]
      tags: [CHED reports]
      parameters:
        - { name: report, in: path, required: true, schema: { type: string, enum: [enrollment-list, nstp-enrollment, nstp-graduates, nstp-summary] } }
        - { name: academic_term_id, in: query, required: true, schema: { type: integer } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx] } }
      responses:
        "200":
          description: The file.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown report }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/notifications/{notification}/read:
    patch:
      operationId: patchNotificationRead
      summary: Mark an owned notification as read
      description: >
        Sets read_at once and is idempotent: retrying preserves the original
        read timestamp. A different user's notification is forbidden without
        disclosing its content.
      security:
        - bearerAuth: []
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: notification
          in: path
          required: true
          description: Notification primary key.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The notification is marked as read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No notification exists for the supplied primary key.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/academic-terms/{academicTerm}/faculty-load-limits/{employmentType}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: academicTerm
        in: path
        required: true
        schema:
          type: integer
      - name: employmentType
        in: path
        required: true
        schema:
          type: string
          enum: [full_time, part_time]
    put:
      operationId: putFacultyLoadLimit
      summary: Set the maximum teaching units for an employment type
      description: >
        Program Head or Dean, for their own college only (ADR 0033). No number
        is invented: until one is set, that employment type has no limit and
        nobody of that type is flagged as overloaded. Saving the value already
        in place changes nothing and writes no audit record.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [max_units]
              properties:
                max_units:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 99
      responses:
        "200":
          description: The limit now in force.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [type, academic_term_id, college, employment_type, max_units]
                    properties:
                      type:
                        type: string
                        const: faculty_load_limit
                      academic_term_id:
                        type: integer
                      college:
                        type: string
                      employment_type:
                        type: string
                        enum: [full_time, part_time]
                      max_units:
                        type: number
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown term or employment type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The value is not a positive number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/academic-terms/{academicTerm}/faculty-load-overrides/{professor}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: academicTerm
        in: path
        required: true
        schema:
          type: integer
      - name: professor
        in: path
        required: true
        description: The professor's user ID.
        schema:
          type: integer
    put:
      operationId: putFacultyLoadOverride
      summary: Set one professor's own maximum teaching units for a term
      description: >
        Program Head or Dean, for a professor of their own college (ADR 0033).
        A reason is required and lands in the audit record. The override
        outranks the employment-type limit and the college default. Saving
        what is already in place changes nothing.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [max_units, reason]
              properties:
                max_units:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 99
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
      responses:
        "200":
          description: The override now in force.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [type, academic_term_id, professor_id, max_units, reason]
                    properties:
                      type:
                        type: string
                        const: faculty_load_override
                      academic_term_id:
                        type: integer
                      professor_id:
                        type: integer
                      max_units:
                        type: number
                      reason:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Missing reason, not a professor, or a professor of another college.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFacultyLoadOverride
      summary: Remove a professor's override
      description: >
        Same authority as setting one. The normal limit applies again.
        Removing an override that is not there changes nothing.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      responses:
        "204":
          description: No override remains.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The professor belongs to another college or is not a professor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/faculty-members/{professor}/profile:
    get:
      operationId: getFacultyProfile
      summary: A professor's teaching profile
      description: >
        Registrar Head only (stakeholder Doc 14). Read-only. Returns who the
        professor is, every term they have taught (sections and units), and,
        for one term, each section with its schedule, seats, and grade
        submission counts (draft, submitted, locked). Counts only: no student
        is named. Without `academic_term_id` it uses the ongoing term if the
        professor teaches in it, otherwise their most recent term;
        `selected_term` is null for a professor with no sections.
      security:
        - bearerAuth: []
      tags:
        - Faculty
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: professor
          in: path
          required: true
          description: The professor's user ID.
          schema:
            type: integer
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The professor's teaching profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [professor, terms, selected_term]
                    properties:
                      professor:
                        type: object
                        required: [id, name, college, status, employment_type, employment_type_label, masters_degree]
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          college:
                            type: ["string", "null"]
                          status:
                            type: string
                          employment_type:
                            type: ["string", "null"]
                            enum: [full_time, part_time, null]
                          employment_type_label:
                            type: ["string", "null"]
                          masters_degree:
                            type: ["string", "null"]
                      terms:
                        type: array
                        items:
                          type: object
                          required: [academic_term_id, label, sections_count, total_units]
                          properties:
                            academic_term_id:
                              type: integer
                            label:
                              type: string
                            sections_count:
                              type: integer
                            total_units:
                              type: number
                      selected_term:
                        type: ["object", "null"]
                        required: [academic_term_id, label, total_units, sections]
                        properties:
                          academic_term_id:
                            type: integer
                          label:
                            type: string
                          total_units:
                            type: number
                          sections:
                            type: array
                            items:
                              type: object
                              required:
                                - section_id
                                - section_code
                                - subject_code
                                - subject_title
                                - units
                                - schedule_days
                                - starts_at_time
                                - ends_at_time
                                - room
                                - modality
                                - status
                                - enrolled_count
                                - capacity
                                - grades
                              properties:
                                section_id:
                                  type: integer
                                section_code:
                                  type: string
                                subject_code:
                                  type: string
                                subject_title:
                                  type: string
                                units:
                                  type: number
                                schedule_days:
                                  type: ["string", "null"]
                                starts_at_time:
                                  type: ["string", "null"]
                                ends_at_time:
                                  type: ["string", "null"]
                                room:
                                  type: ["string", "null"]
                                modality:
                                  type: ["string", "null"]
                                status:
                                  type: string
                                enrolled_count:
                                  type: integer
                                capacity:
                                  type: integer
                                grades:
                                  type: object
                                  required: [draft, submitted, locked, total]
                                  properties:
                                    draft:
                                      type: integer
                                    submitted:
                                      type: integer
                                    locked:
                                      type: integer
                                    total:
                                      type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No user exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The term does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit-logs/actors:
    get:
      operationId: getAuditActors
      summary: Audit activity grouped by user
      description: >
        Registrar Head only. One row per user who has audit records, newest
        activity first, with how many records match the filters. Read that
        user's records with `GET /audit-logs?actor_user_id=`. Accepts the same
        filters as `GET /audit-logs` except the actor. Each successful view
        creates an `audit_log.list_viewed` record.
      security:
        - bearerAuth: []
      tags:
        - Audit
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: auditable_type
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One row per acting user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditActor"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit-logs:
    get:
      operationId: getAuditLogs
      summary: List operational audit history
      description: >
        Registrar Head only. Results are ordered newest first and may be
        filtered by the exact audited action, entity type, actor, or inclusive
        UTC date bounds. Each successful view creates an
        `audit_log.list_viewed` record after the result query is built.
      security:
        - bearerAuth: []
      tags:
        - Audit
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - curriculum.created
              - curriculum.updated
              - faculty_availability.created
              - faculty_availability.updated
              - faculty_availability.deleted
              - faculty_subject_preference.created
              - faculty_subject_preference.updated
              - faculty_subject_preference.deleted
              - section.created
              - section.updated
              - section.professor_reassigned
              - section_change_request.requested
              - section_change_request.approved
              - section_change_request.rejected
              - section_change_request.cancelled
              - schedule_proposal.created
              - schedule_proposal.dean_approved
              - schedule_proposal.dean_returned
              - schedule_proposal.executive_approved
              - schedule_proposal.executive_returned
              - schedule_proposal.published
              - section.published
              - schedule_proposal.closed
              - student_profile.provisioned
              - audit_log.list_viewed
              - faculty_directory.list_viewed
              - enrollment.submitted
              - enrollment.program_head_approved
              - enrollment.program_head_rejected
              - enrollment.registrar_approved
              - enrollment.registrar_rejected
              - enrollment.voided
              - enrollment.cancelled_by_student
              - enrollment_subject_waiver.granted
              - enrollment_subject_waiver.revoked
              - academic_grade.created
              - academic_grade.updated
              - academic_grade.submitted
              - academic_grade.locked
              - queue_ticket.serving_started
              - queue_ticket.served
              - enrollment.payment_confirmed
              - withdrawal_request.created
              - withdrawal_request.approved
              - withdrawal_request.rejected
              - transferee_credit.created
              - transferee_credit.updated
              - transferee_credit.endorsed
              - transferee_credit.approved
              - transferee_credit.rejected
              - transferee_credit.submitted
              - transferee_credit.returned
              - transferee_credit.deleted
        - name: auditable_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - curriculum
              - faculty_availability
              - faculty_subject_preference
              - section
              - section_change_request
              - schedule_proposal
              - student_profile
              - audit_log
              - faculty_directory
              - enrollment
              - academic_grade
              - queue_ticket
              - withdrawal_request
              - transferee_credit
        - name: actor_user_id
          in: query
          required: false
          description: Existing user primary key.
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          description: Inclusive lower UTC calendar date.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive upper UTC calendar date; cannot precede from.
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          required: false
          description: Number of audit records per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Filtered operational audit history.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditLogCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Optional caller correlation ID containing 1–128 ASCII letters, digits,
        dots, underscores, or hyphens. Invalid values are replaced.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
  headers:
    RequestId:
      description: The validated caller ID or a server-generated correlation ID.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
    NoStore:
      description: The response contains a no-store cache directive.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
    NoStorePrivate:
      description: >
        The response contains no-store and private directives, since it may
        carry a bearer token or identity detail no shared cache may retain.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
  responses:
    Unauthenticated:
      description: A valid bearer token is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        The authenticated role is not authorized to perform this action.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current resource state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: The request is invalid for the current lifecycle state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The caller has exceeded the applicable request rate.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds until the caller should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The API could not complete the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SubjectWithdrawalOverviewEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [withdrawable, withdrawn]
          properties:
            withdrawable:
              type: array
              items:
                type: object
                properties:
                  enrollment_subject_id: { type: integer }
                  enrollment_id: { type: integer }
                  academic_term_id: { type: integer }
                  term_label: { type: string }
                  subject_code: { type: string }
                  subject_title: { type: string }
                  units: { type: number }
                  section_code: { type: string }
            withdrawn:
              type: array
              items:
                type: object
                properties:
                  academic_grade_id: { type: integer }
                  term_label: { type: string }
                  subject_code: { type: string }
                  subject_title: { type: string }
                  section_code: { type: [string, "null"] }
                  reason: { type: [string, "null"] }
                  withdrawn_by: { type: string }
                  withdrawn_at: { type: [string, "null"], format: date-time }
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/HealthResource"
    HealthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - service
        - status
        - api_version
        - generated_at
      properties:
        type:
          type: string
          const: service-health
        service:
          type: string
          const: grc-enrollment-api
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        generated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    AccountSetupRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          maxLength: 255
          description: One-time code delivered separately in the account-setup email body.
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          minLength: 8
        privacy_notice_acknowledged:
          type: boolean
          const: true
          description: >
            The person read and agreed to the Data Privacy Notice on the setup
            page (ADR 0055). Optional; sent with `privacy_notice_version`, and
            then recorded as their own agreement so the first sign-in does not ask
            again. The faculty and staff setup requests accept the same two fields.
        privacy_notice_version:
          type: string
          description: Required with `privacy_notice_acknowledged`; must be the current version.
    AccountSetupResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - type
            - status
          properties:
            type:
              type: string
              const: account-setup
            status:
              type: string
              const: active
    FacultyAccountSetupRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
        - name
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          maxLength: 255
          description: One-time code delivered separately in the account-setup email body.
        name:
          type: string
          maxLength: 255
          description: The professor's full name — the inviting Chair supplied only an email address.
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          minLength: 8
    FacultyAccountSetupResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - type
            - status
          properties:
            type:
              type: string
              const: faculty-account-setup
            status:
              type: string
              const: active
    StoreFacultyInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    FacultyInvitation:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - email
        - name
        - status
        - invitation_sent_at
        - activated_at
      properties:
        type:
          type: string
          const: faculty_invitation
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
          description: A placeholder derived from the email's local part until the professor completes setup.
        status:
          type: string
          enum: [pending, activated, failed]
        invitation_sent_at:
          type: [string, 'null']
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
    FacultyInvitationResponse:
      type: object
      additionalProperties: false
      required:
        - data
