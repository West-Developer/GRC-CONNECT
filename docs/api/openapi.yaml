        academic_term_id:
          type: integer
        college:
          type: ["string", "null"]
          enum: [ccs, coe, coa, cbae, null]
        college_label:
          type: ["string", "null"]
        academic_term_label:
          type: string
        section_plan_id:
          type: ["integer", "null"]
        submitted_by:
