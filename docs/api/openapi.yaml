      properties:
        action:
          type: string
          enum:
            - serve
            - complete
            - skip
            - mark_priority
            - announce
    PaginatedPaymentCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentResource"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaymentResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - enrollment_id
        - student_number
        - external_reference
        - amount
        - confirmed_at
      properties:
        type:
          type: string
          const: payment
        id:
          type: integer
        enrollment_id:
          type: integer
        student_number:
          type: string
        external_reference:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
          description: >
            Decimal string, never a float — money must not go through
            binary floating point.
        confirmed_at:
          type: string
          format: date-time
    ConfirmPaymentRequest:
      type: object
      additionalProperties: false
      properties:
        external_reference:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
          minimum: 0
          maximum: 99999999.99
          description: >
            Exact decimal, matching the `payments.amount` column's own
            `decimal(10,2)` capacity — PRD §17 leaves whether this field is
            required, and any currency/rounding rule, unconfirmed.
        payment_type:
          type: string
          enum: ["full", "installment"]
          description: >
            ADR 0046. `full` takes the full-payment discount when one applies and requires
            `quoted_amount` and no `amount`. `installment` requires `amount` and takes no
            discount and no extra fee. Absent behaves as before.
        quoted_amount:
          type: ["number", "string", "null"]
          minimum: 0
          maximum: 99999999.99
          pattern: '^\d+(\.\d{1,2})?$'
          description: >
            With `full`: the net the Cashier was shown (`net_total` of the payment quote), as a
            decimal string or number with at most two decimals (no exponent form). If the
            server's figure differs, 422 on `quoted_amount` and nothing is written.
    PaymentQuoteResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, total_amount, full_payment]
          properties:
            type:
              type: string
              enum: [payment_quote]
            total_amount:
              type: string
              description: Decimal string; the amount due before any full-payment discount.
            full_payment:
              type: object
              additionalProperties: false
              required: [applies, percentage, discount_amount, net_total, reason]
              properties:
                applies:
                  type: boolean
                  description: True when a discount is taken from a full payment (`reason` is then null).
                percentage:
                  type: ["string", "null"]
                  description: Decimal string with one decimal, e.g. `10.0`; null when no discount applies.
                discount_amount:
                  type: ["string", "null"]
                  description: Decimal string; null when no discount applies.
                net_total:
                  type: string
                  description: Decimal string; always what a full payment collects.
                reason:
                  type: ["string", "null"]
                  enum: [off, scheduled, expired, scholar, null]
                  description: >
                    Why no discount applies: `off` (percentage 0), `scheduled` (before `valid_from`),
                    `expired` (after `valid_until`) or `scholar` (the assessment already has a
                    scholarship line). Null when one applies.
    PaymentDiscountSettingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, percentage, valid_from, valid_until, status, updated_by, updated_at]
          properties:
            type:
              type: string
              enum: [payment_discount_setting]
            percentage:
              type: string
              description: Decimal string with one decimal, e.g. `10.0`.
            valid_from:
              type: ["string", "null"]
              format: date
              description: Inclusive first day (Asia/Manila); null is open-ended.
            valid_until:
              type: ["string", "null"]
              format: date
              description: Inclusive last day (Asia/Manila); null is open-ended.
            status:
              type: string
              enum: [active, scheduled, expired, off]
              description: Where the setting stands today in the school's calendar.
            updated_by:
              type: ["string", "null"]
              description: Name of the user who last saved it; null before any save.
            updated_at:
              type: ["string", "null"]
              format: date-time
    UpdatePaymentDiscountSettingRequest:
      type: object
      additionalProperties: false
      required: [percentage, valid_from, valid_until]
      properties:
        percentage:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.1
          description: At most one decimal place; 0 turns the discount off.
        valid_from:
          type: ["string", "null"]
          format: date
          description: Must be sent; null clears it.
        valid_until:
          type: ["string", "null"]
          format: date
          description: Must be sent; null clears it. Cannot be before `valid_from`.
    PaymentConfirmationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
