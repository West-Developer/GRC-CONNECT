    StudentProfileResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - user_id
        - student_number
        - name
        - first_name
        - middle_name
        - middle_initial
        - last_name
        - suffix
        - email
        - address
        - gender
        - birth_date
        - citizenship
        - contact_number
        - street_barangay
        - town_city
        - province
        - generated_fields
        - program_id
        - program_code
        - program_name
        - curriculum_id
        - entry_year
        - curriculum_name
        - curriculum_effective_school_year
        - year_level
        - enrollment_category
        - student_type
        - student_type_label
        - admission_status
        - admission_status_label
        - academic_standing
        - academic_standing_label
        - financial_status
        - financial_status_label
        - requirements_verified_at
        - academic_setup_editable
        - account_setup_status
        - invitation_delivery_status
        - freshman_payment_confirmed_at
        - enrollment_deadline_at
        - freshman_status
        - advance_payment_held
        - queue_ticket_number
        - queue_link_delivery_status
      properties:
        type:
          type: string
          const: student_profile
        id:
          type: integer
        user_id:
          type: integer
        student_number:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-\d{5}$'
        name:
          type: string
          description: Composed display name — "First M. Last Suffix". Always kept in sync with the split name fields.
        first_name:
          type: string
        middle_name:
          type: [string, 'null']
          description: >
            The full middle name. Only Admission staff and the student on their own profile receive it;
            every other role gets null (and an older account that has only an initial has none).
        middle_initial:
          type: [string, 'null']
          maxLength: 10
          description: What every display of the name shows ("West R. Ragma"); derived from the middle name.
        last_name:
          type: string
        suffix:
          type: [string, 'null']
          maxLength: 20
        email:
          type: string
          format: email
        address:
          type: [string, 'null']
          maxLength: 1000
          description: >
            The address as one text, written by the server from `street_barangay`, `town_city` and
            `province` whenever one of them is entered. A client never sets it (ADR 0049).
        gender:
          type: [string, 'null']
          enum: [M, F, null]
          description: The details the CHED forms ask for (ADR 0049); null on an account that has none yet.
        birth_date:
          type: [string, 'null']
          format: date
        citizenship:
          type: [string, 'null']
          maxLength: 100
        contact_number:
          type: [string, 'null']
          maxLength: 30
        street_barangay:
          type: [string, 'null']
          maxLength: 255
        town_city:
          type: [string, 'null']
          maxLength: 255
        province:
          type: [string, 'null']
          maxLength: 255
        generated_fields:
          type: array
          items:
            type: string
            enum: [gender, birth_date, citizenship, contact_number, street_barangay, town_city, province]
          description: >
            The details above that were generated for the demo by `students:populate-demographics`
            and not typed by Admission. An empty list for every account whose details were entered.
            A value Admission enters in a correction is removed from this list.
        program_id:
          type: integer
        program_code:
          type: string
        program_name:
          type: string
        curriculum_id:
          type: integer
        entry_year:
          type: [integer, 'null']
        curriculum_name:
          type: string
        curriculum_effective_school_year:
          type: string
        year_level:
          type: integer
          minimum: 1
          maximum: 4
        enrollment_category:
          type: [string, 'null']
          enum: [regular, irregular, null]
        student_type:
          type: [string, 'null']
          description: Whether the student entered as a Freshman or a Transferee. Informational only.
          enum: [freshman, transferee, null]
        student_type_label:
          type: [string, 'null']
        admission_status:
          type: string
          enum: [pending, admitted, enrolled, graduated, withdrawn]
        admission_status_label:
          type: string
        academic_standing:
          type: string
          enum: [good, probation, warning]
        academic_standing_label:
          type: string
        financial_status:
          type: [string, 'null']
          description: Informational only; it is not read by fee computation.
          enum: [scholar, payee, null]
        financial_status_label:
          type: [string, 'null']
        requirements_verified_at:
          type: [string, 'null']
          format: date-time
        academic_setup_editable:
          type: boolean
          description: False after the Student has any enrollment.
        account_setup_status:
          type: string
          enum: [awaiting_payment, pending, active]
          description: >
            `awaiting_payment`: a freshman who has a queue number but whose
            first payment the Cashier has not confirmed; the account setup
            email is sent only after that (ADR 0043).
        invitation_delivery_status:
          type: string
          enum: [not_sent, sent, failed]
        freshman_payment_confirmed_at:
          type: [string, 'null']
          format: date-time
          description: Set once, when the Cashier confirms a freshman's first payment.
        enrollment_deadline_at:
          type: [string, 'null']
          format: date-time
          description: >
            A newly created Transferee or Returnee has 7 days from Admission creating the account
            (or admitting the student again with a new setup invitation) to get an enrollment
            approved by the Registrar (ADR 0048). While this is set the student sees only
            Enrollment; the hourly `students:deactivate-overdue` command deactivates the account
            when it passes; the Registrar's approval clears it. Null for every other student and
            for every account that existed before the rule.
        queue_ticket_number:
          type: [string, 'null']
          description: A freshman's queue number issued at Admission; null for every other student.
        queue_link_delivery_status:
          type: [string, 'null']
          enum: [not_sent, sent, failed, null]
          description: Delivery of the emailed live-queue link; null when there is no queue number.
        freshman_status:
          type: [string, 'null']
          enum: [awaiting_payment, awaiting_section, enrolling, null]
          description: >
            Where a freshman is in the pay-first flow (ADR 0043); null for every
            other student. `awaiting_payment`: no confirmed first payment yet.
            `awaiting_section`: paid, but every section was full so the payment
            is held and no enrollment is in progress. `enrolling`: paid, with an
            enrollment in progress or done. Derived, not stored.
        advance_payment_held:
          type: boolean
          description: >
            True while a freshman's first payment is held as credit and has not yet been applied
            to an enrollment (ADR 0043) — the condition under which a Registrar approval completes
            the enrollment from that credit. The student's own screens use it to say there is no
            queue number to claim and nothing more to pay. About the money, not the term: false once
            the credit is applied, and for any student who never held any. Derived, not stored.
    FreshmanPaymentPreviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FreshmanPaymentPreviewResource"
    FreshmanPaymentPreviewResource:
      type: object
      additionalProperties: false
      required:
        - type
        - student_id
        - student_number
        - student_name
        - student_type
        - ticket_number
        - minimum_amount
        - already_confirmed
        - can_enroll
        - enrollment
        - block
        - estimated_total
        - full_payment
      properties:
        type:
          type: string
          const: freshman_payment_preview
        student_id:
          type: integer
        student_number:
          type: string
        student_name:
          type: string
        student_type:
          type: [string, 'null']
          description: "`freshman` or `transferee`: the two students who pay first (ADR 0043, amended 2026-10-05)."
        enrollment:
          description: >
            A transferee's own chosen subjects waiting at the payment hold
            (`awaiting_first_payment`); null for a freshman and for a
            transferee who has not chosen yet.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, status, status_label, total_units, subjects]
              properties:
                id:
                  type: integer
                status:
                  type: string
                status_label:
                  type: string
                total_units:
                  type: number
                subjects:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, title, units]
                    properties:
                      code:
                        type: string
                      title:
                        type: string
                      units:
                        type: number
        ticket_number:
          type: [string, 'null']
          description: The student's queue number, if one was issued.
        minimum_amount:
          type: string
          description: Decimal string; the smallest first payment accepted (PHP).
        already_confirmed:
          type: boolean
          description: True when the first payment was already confirmed; confirming again changes nothing.
        can_enroll:
          type: boolean
          description: >
            For a freshman: false when every section is full or they are in the Irregular category, so the payment
            would be held as credit. For a transferee: true when they have chosen subjects (`enrollment` is set);
            false when they have not, so the payment would be held until they choose and submit.
        block:
          description: The section the freshman would get; null when `can_enroll` is false and always null for a transferee.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [block_code, total_units, seats_remaining, subjects]
              properties:
                block_code:
                  type: string
                total_units:
                  type: number
                seats_remaining:
                  type: integer
                  description: The fewest seats left among the block's subjects.
                subjects:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, title, units]
                    properties:
                      code:
                        type: string
                      title:
                        type: string
                      units:
                        type: number
        estimated_total:
          type: [string, 'null']
          description: Decimal string; what the enrollment would be assessed to owe. Null when `block` is null.
        full_payment:
          type: object
          additionalProperties: false
          required: [applies, percentage, discount_amount, net_total, reason]
          description: >
            ADR 0046: what paying in full would collect, estimated like `estimated_total` (no
            assessment exists yet). All keys are always present. `net_total` is the amount a full
            payment collects, discounted when `applies` is true.
          properties:
            applies:
              type: boolean
              description: True when a discount is taken from a full payment (`reason` is then null).
            percentage:
              type: ["string", "null"]
              description: Decimal string with one decimal, e.g. `10.0`; null when no discount applies.
            discount_amount:
              type: ["string", "null"]
              description: Decimal string; null when no discount applies.
            net_total:
              type: ["string", "null"]
              description: Decimal string; null only when `reason` is `no_estimate`.
            reason:
              type: ["string", "null"]
              enum: [off, scheduled, expired, no_estimate, null]
              description: >
                Why no discount applies: `off` (percentage 0), `scheduled` (before `valid_from`),
                `expired` (after `valid_until`) or `no_estimate` (`estimated_total` is null, so there
                is nothing to estimate from; every amount is then null and a full payment is
                refused). Null when one applies. `scholar` cannot occur: no assessment
                exists to hold a scholarship line.
    ConfirmFreshmanPaymentRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1000
          maximum: 99999999.99
          description: >
            At least the configured minimum (`enrollment.freshman_payment.minimum_amount`,
            PHP 1,000.00). Anything at or above it enrolls the freshman; the unpaid
            balance stays on the account. There is no promissory-note field.
        external_reference:
          type: [string, 'null']
          maxLength: 255
          description: The Cashier's receipt reference.
        payment_type:
          type: string
          enum: [full, installment]
          description: >
            ADR 0046. With `full`, `amount` must equal the previewed `full_payment.net_total`
            (422 on `amount` otherwise, and 422 on `payment_type` when no estimate exists), the
            money is held as credit like any first payment, and the quoted percentage is frozen
            on the student profile for the Registrar's approval to apply. `installment`, or the
            field absent, is the ordinary first payment with no discount.
    FreshmanPaymentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FreshmanPaymentResource"
    FreshmanPaymentResource:
      type: object
      additionalProperties: false
      required:
        - type
        - outcome
        - block_code
        - student
        - enrollment
        - payment
        - document
        - held_amount
      properties:
        type:
          type: string
          const: freshman_payment
        outcome:
          type: string
          enum: [awaiting_registrar_approval, awaiting_section, enrolled]
          description: >
            `awaiting_registrar_approval`: the payment is in and the freshman is
            submitted to `block_code` (a transferee's chosen enrollment moves
            from `awaiting_first_payment` to `pending_registrar_approval`);
            Registrar Staff approval enrolls them and
            only then is the enrolled email sent (2026-10-04).
            `awaiting_section`: the payment is held as credit; the freshman is
            told when a section opens, a transferee is told to choose and submit
            their subjects (2026-10-05).
            `enrolled`: the Registrar has approved (returned only by a repeat call).
        block_code:
          type: [string, 'null']
        student:
          type: object
          additionalProperties: false
          required: [id, student_number, name]
          properties:
            id:
              type: integer
            student_number:
              type: string
            name:
              type: string
        enrollment:
          description: Null when the payment was held.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, status, total_units]
              properties:
                id:
                  type: integer
                status:
                  type: string
                total_units:
                  type: number
        payment:
          description: The recorded payment; null when the payment was held.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [external_reference, amount, promissory_note_on_file, confirmed_at]
              properties:
                external_reference:
                  type: [string, 'null']
                amount:
                  type: [string, 'null']
                  description: Decimal string, never a float.
                promissory_note_on_file:
                  type: boolean
                confirmed_at:
                  type: string
                  format: date-time
        document:
          description: The Certificate of Registration made for the enrollment; null when the payment was held.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, document_type, document_number, generated_at]
              properties:
                id:
                  type: integer
                document_type:
                  type: string
                document_number:
                  type: string
                generated_at:
                  type: string
                  format: date-time
        held_amount:
          type: [string, 'null']
          description: Decimal string; how much is held as credit when `outcome` is `awaiting_section`, otherwise null.
    PaginatedRegistrarStudentCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegistrarStudentResource"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    RegistrarStudentResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - student_number
        - name
        - program_code
        - year_level
        - enrollment_category
        - academic_standing
        - academic_standing_label
      properties:
        type:
          type: string
          const: registrar_student
        id:
