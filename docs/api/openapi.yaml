        - enrollment_subject_id
        - student_id
        - student_number
        - student_name
        - grade_id
        - mark
        - mark_label
        - remarks
        - status
        - status_label
      properties:
        enrollment_subject_id: { type: integer, minimum: 1 }
        student_id: { type: integer, minimum: 1 }
        student_number: { type: string }
        student_name: { type: string }
        grade_id: { type: [integer, "null"], minimum: 1 }
        mark:
          type: [string, "null"]
          enum: ["1.00", "1.25", "1.50", "1.75", "2.00", "2.25", "2.50", "2.75", "3.00", "5.00", C, NC, INC, DRP, W, null]
        mark_label: { type: [string, "null"] }
        remarks: { type: [string, "null"] }
        status:
          type: string
          enum: [not_recorded, draft, submitted, locked]
        status_label: { type: string }
    SaveSectionGradeDraftsRequest:
      type: object
