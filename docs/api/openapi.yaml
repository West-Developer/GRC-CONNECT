          type: string
        is_required:
          type: boolean
        is_eligible:
          type: boolean
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/EligibleSubjectReason"
        available_sections:
          type: array
          items:
            $ref: "#/components/schemas/EligibleSectionResource"
    EligibleSectionResource:
      type: object
      additionalProperties: false
      description: >
        A SectionResource payload plus the department fields the eligible-subject
        pool computes per section. `is_own_department` is false when the section
        was sourced from another college's identical (same code + units) subject
        row; `subject_code`/`subject_title` are that section's OWN subject, so a
        student can see the real course name before choosing it.
      required:
        - type
        - id
        - academic_term_id
        - subject_id
        - section_code
        - professor_id
        - schedule_days
        - starts_at_time
        - ends_at_time
        - room
        - capacity
        - viability_threshold
        - enrolled_count
        - remaining_seats
        - status
        - status_label
        - college
        - is_own_department
        - subject_code
        - subject_title
      properties:
        type:
          type: string
          const: section
        id:
          type: integer
        academic_term_id:
          type: integer
        subject_id:
          type: integer
        section_code:
          type: string
        professor_id:
          type: ["integer", "null"]
        schedule_days:
          type: ["string", "null"]
          description: >
            Shorthand such as "MWF" or "TTh" — see
            App\Domain\Scheduling\ScheduleDayParser.
        starts_at_time:
          type: ["string", "null"]
          format: time
        ends_at_time:
          type: ["string", "null"]
          format: time
        room:
          type: ["string", "null"]
        modality:
          type: ["string", "null"]
          enum: [online, hyflex_a, hyflex_b, f2f, null]
          description: Manual delivery modality; Google Classroom is intentionally excluded.
        capacity:
          type: integer
        viability_threshold:
          type: ["integer", "null"]
          description: >
            Informational only — PRD §17 leaves the actual threshold value
            unconfirmed.
        enrolled_count:
          type: integer
          description: Maintained counter, not writable via this API.
        remaining_seats:
          type: integer
          description: capacity minus enrolled_count, floored at zero. Display only.
        status:
          type: string
          description: >
            PROVISIONAL vocabulary pending PRD §17 approval — see
            App\Domain\Scheduling\SectionStatus.
          enum:
            - planned
            - published
            - closed
            - cancelled
        status_label:
          type: string
        college:
          type: ["string", "null"]
          enum: [ccs, coe, coa, cbae, null]
        is_own_department:
          type: boolean
        subject_code:
          type: string
        subject_title:
          type: string
    EligibleSubjectReason:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - eligible
            - completed
            - already_selected
            - prerequisite
            - prerequisite_advisory
            - prerequisite_waived
            - no_sections_available
            - block_restricted
          description: >
            Machine-checkable category. `prerequisite_advisory` and
            `block_restricted` reflect PRD §17 decisions pending formal GRC
            approval — see App\Domain\Academic\PrerequisiteEvaluator and
            App\Actions\Enrollment\BuildEligibleSubjectPool.
        message:
          type: string
    PaginatedEnrollmentCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentResource"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/EnrollmentResource"
    EnrollmentResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - student_id
        - student_number
        - student_name
        - student_financial_status
        - student_financial_status_label
        - academic_term_id
        - status
        - status_label
        - total_units
        - requires_overload_approval
        - unit_maximum
        - exceeds_unit_maximum
        - submitted_at
        - program_head_decided_at
        - registrar_decided_at
        - payment_confirmed_at
        - enrolled_at
        - subjects
        - queue_ticket
        - assessment
      properties:
        type:
          type: string
          const: enrollment
        id:
          type: integer
        student_id:
          type: integer
        student_number:
          type: string
        student_name:
          type: ["string", "null"]
          description: >
            Never email or name — exposed so the Registrar Head and
            Accounting Staff can identify whose enrollment they are
            processing.
        student_financial_status:
          type: [string, 'null']
          description: >
            Informational only — never read by fee computation. See
            App\Domain\Identity\FinancialStatus.
          enum:
            - scholar
            - payee
            - null
        student_financial_status_label:
          type: [string, 'null']
        academic_term_id:
          type: integer
        status:
          type: string
          description: >
            PRD §4.2's authoritative lifecycle — see
            App\Domain\Enrollment\EnrollmentStatus. `awaiting_first_payment` is
            the payment hold of a transferee who has not paid yet (ADR 0043,
            amended 2026-10-05): the Registrar does not see the enrollment
            until the Cashier has confirmed the first payment.
          enum:
            - draft
            - pending_program_head_approval
            - pending_student_review
            - awaiting_first_payment
            - pending_registrar_approval
            - pending_payment
            - enrolled
            - rejected
            - cancelled
            - withdrawn
        status_label:
          type: string
        total_units:
          type: number
          format: float
        requires_overload_approval:
          type: boolean
          description: >
            FR-ENR-004. True when the submission exceeded
            config('enrollment.max_regular_units') but stayed within
            config('enrollment.overload_max_units'), or (for an irregular
            student who confirmed they are sure) went over the unit maximum.
            registrar_approve is rejected on a flagged enrollment unless the
            request also sends overload_acknowledged: true.
        unit_maximum:
          type: [number, 'null']
          description: >
            The unit maximum that applied to the student when they submitted (their
            curriculum's, or the configured one); null when none applied.
        exceeds_unit_maximum:
          type: boolean
          description: >
            True when `total_units` is over `unit_maximum`. An irregular student may
            submit such a load after confirming (`units_confirmed`); it goes to the
            Program Chair, who sets the right units and schedule.
        submitted_at:
          type: ["string", "null"]
          format: date-time
        program_head_decided_at:
          type: ["string", "null"]
          format: date-time
          description: >
            When the Program Head decided an irregular or overload enrollment
            (ADR 0030). Null for enrollments that never needed that step.
        registrar_decided_at:
          type: ["string", "null"]
          format: date-time
        payment_confirmed_at:
          type: ["string", "null"]
          format: date-time
        enrolled_at:
          type: ["string", "null"]
          format: date-time
        revisions:
          type: array
          description: >
            The Program Chair's changes to the student's subjects, oldest first
            (ADR 0040): the Chair's reason, what was added and removed, and the
            student's answer. Empty when no response loaded the relation.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - note
              - added_subjects
              - removed_subjects
              - units_before
              - units_after
              - status
              - student_reason
              - proposed_at
              - responded_at
            properties:
              id:
                type: integer
              note:
                type: string
              added_subjects:
                type: array
                items:
                  type: object
              removed_subjects:
                type: array
                items:
                  type: object
              units_before:
                type: number
              units_after:
                type: number
              status:
                type: string
                enum:
                  - pending
                  - accepted
                  - declined
              student_reason:
                type: ["string", "null"]
              proposed_at:
                type: ["string", "null"]
                format: date-time
              responded_at:
                type: ["string", "null"]
                format: date-time
        subjects:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - section_id
              - section_code
              - subject_code
              - subject_title
              - units
              - schedule_days
              - starts_at_time
              - ends_at_time
              - room
              - modality
              - professor_name
              - status
              - status_label
            properties:
              section_id:
                type: integer
              section_code:
                type: string
              subject_code:
                type: string
              subject_title:
                type: string
              units:
                type: number
              schedule_days:
                type: ["string", "null"]
              starts_at_time:
                type: ["string", "null"]
              ends_at_time:
                type: ["string", "null"]
              room:
                type: ["string", "null"]
              modality:
                type: ["string", "null"]
                enum:
                  - hyflex_a
                  - hyflex_b
                  - f2f
              professor_name:
                type: ["string", "null"]
              status:
                type: string
                enum:
                  - selected
                  - enrolled
                  - dropped
              status_label:
                type: string
        queue_ticket:
          type: ["object", "null"]
          additionalProperties: false
          required:
            - ticket_number
            - queue_date
            - status
            - status_label
            - priority
            - priority_label
            - position
          properties:
            ticket_number:
              type: string
              description: >
                Resets daily (Q001, Q002, ...) — PRD §17 leaves the exact
                numbering scheme unconfirmed.
            queue_date:
              type: string
              format: date
            status:
              type: string
              enum:
                - waiting
                - serving
                - served
                - cancelled
            status_label:
              type: string
            priority:
              type: string
              enum:
                - regular
                - priority
            priority_label:
              type: string
            position:
              type: ["integer", "null"]
              description: >
                How many other waiting tickets stand ahead of this one
                today. Null once the ticket has left waiting. Never the
                full queue — only the holder's own count, for privacy.
        assessment:
          type: ["object", "null"]
          additionalProperties: false
          description: >
            PRD §5.3 process 3.3 "computes the approved assessment" —
            null for any enrollment that has never reached
            registrar_approve. See App\Actions\Billing\AssessEnrollment.
            Every value here is provisional per PRD §17; see
            config/fees.php.
          required:
            - total_amount
            - currency
            - assessed_at
            - items
          properties:
            total_amount:
              type: ["string", "null"]
              description: >
                Decimal string, never a float — money must not go
                through binary floating point.
            currency:
              type: string
            assessed_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - category
                  - category_label
                  - label
                  - quantity
                  - unit_amount
                  - amount
                properties:
                  category:
                    type: string
                    enum:
                      - tuition
                      - miscellaneous
                      - scholarship_discount
                      - full_payment_discount
                    description: >
                      `scholarship_discount` (ADR 0025) and `full_payment_discount`
                      (ADR 0046) are discount lines with a negative `amount`.
                  category_label:
                    type: string
                  label:
                    type: string
                  quantity:
                    type: ["string", "null"]
                    description: >
                      Units, for the tuition line; on a discount line the
                      percentage instead (for example `10.0`). Null otherwise.
                  unit_amount:
                    type: ["string", "null"]
                    description: Per-unit rate, for the tuition line only (null on a discount line).
                  amount:
                    type: ["string", "null"]
                    description: Decimal string; negative on a discount line.
    StoreEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
        - academic_term_id
        - sections
      properties:
        academic_term_id:
          type: integer
        sections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - section_id
            properties:
              section_id:
                type: integer
        units_confirmed:
          type: boolean
          description: >
            An irregular student's "yes, I am sure" for a load over the unit maximum.
            Without it such a submission is refused with a `units_confirmed`
            validation error naming the units and the maximum; with it the enrollment
            is created and goes to the Program Chair, flagged. A Regular student's
            load can never pass the maximum, with or without it.
    UpdateEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - program_head_approve
            - program_head_reject
            - registrar_approve
            - registrar_reject
            - void
            - student_cancel
            - student_accept_revision
            - student_decline_revision
        requested_by_student:
          type: boolean
          description: >
            Only meaningful for void: the Registrar is acting on the
            student's request. Recorded in the audit row.
        reason:
          type: ["string", "null"]
          description: >
            Required exactly when action is program_head_reject,
            registrar_reject, void, student_cancel (the owning student's own
            cancellation, allowed until the Registrar approves) or
            student_decline_revision (the student's reason for not accepting
            the Program Chair's changes to their subjects, ADR 0040).
            student_accept_revision takes none.
        overload_acknowledged:
          type: boolean
          description: >
            Required true when action is program_head_approve (or
            registrar_approve on an enrollment the Program Head never saw) AND
            the target enrollment's own requires_overload_approval is true
            (FR-ENR-004). Ignored otherwise.
    PaginatedAcademicGradeCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcademicGradeResource"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    AcademicGradeResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AcademicGradeResource"
    AcademicGradeResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - student_id
        - student_number
        - subject_id
        - subject_code
        - section_id
        - academic_term_id
        - final_grade
        - remarks
        - status
        - status_label
        - submitted_at
        - locked_at
      properties:
        type:
          type: string
          const: academic_grade
        id:
          type: integer
        student_id:
          type: integer
        student_number:
          type: string
        subject_id:
          type: integer
        subject_code:
          type: string
        section_id:
          type: ["integer", "null"]
        academic_term_id:
          type: integer
        final_grade:
          type: ["string", "null"]
          description: >
            Carried as the exact decimal string, never coerced to a float or
