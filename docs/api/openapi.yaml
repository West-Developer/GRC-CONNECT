    StudentQueueViewResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/StudentQueueViewResource"
    StudentQueueViewResource:
      type: object
      additionalProperties: false
      required:
        - type
        - stage
        - can_claim
        - ticket
        - now_serving_ticket_number
        - upcoming_ticket_numbers
        - cut_off_today
      properties:
        type:
          type: string
          const: student_queue_view
        stage:
          type: string
          enum:
            - no_active_enrollment
            - pending_program_head_approval
            - pending_student_review
            - awaiting_first_payment
            - pending_registrar_approval
            - pending_payment
            - enrolled
            - freshman_awaiting_payment
            - freshman_paid
            - transferee_awaiting_payment
            - transferee_paid
            - transferee_enrolled
          description: >
            `freshman_awaiting_payment` and `freshman_paid` appear only on the
            public live-queue link (ADR 0044): a freshman holding a queue
            number from Admission who has not, or has, had their first
            payment confirmed by the Cashier. `transferee_awaiting_payment`
            and `transferee_paid` are the same for a transferee holding the
            queue number issued when their credit mapping closed.
            `transferee_enrolled` replaces `transferee_paid` on that link once the
            Registrar has approved their enrollment.
            `awaiting_first_payment` is the signed-in transferee's own stage
            while their chosen subjects wait at the payment hold; until the
            Cashier has taken their first payment, `ticket` is the number
            they were emailed even when they have no enrollment yet.
        can_claim:
          type: boolean
          description: >
            True only when the Student has a pending-payment enrollment and
            no ticket. The claim action is available only at the kiosk.
        ticket:
          type: [object, 'null']
          additionalProperties: false
          required:
            - ticket_number
            - status
            - status_label
            - priority
            - priority_label
            - position
            - announce_count
          properties:
            ticket_number:
              type: string
              minLength: 1
            status:
              type: string
              enum:
                - waiting
                - serving
                - served
                - cancelled
            status_label:
              type: string
              minLength: 1
            priority:
              type: string
              enum:
                - regular
                - priority
            priority_label:
              type: string
              minLength: 1
            position:
              type: [integer, 'null']
              minimum: 0
            announce_count:
              type: integer
              minimum: 0
              description: >
                How many times the Cashier has called this ticket out while it
                was `serving`. The Student's device rings again when this
                number increases between polls.
        now_serving_ticket_number:
          type: [string, 'null']
          minLength: 1
        upcoming_ticket_numbers:
          type: array
          items:
            type: string
            minLength: 1
          description: Ticket numbers only; no other Student identity is exposed.
        cut_off_today:
          type: boolean
