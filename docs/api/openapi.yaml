        flag, and the running balance. `academic_term_id` narrows the listed terms
        but balances still include every earlier term (ADR 0036).
      security:
        - bearerAuth: []
      tags:
        - Billing
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: student
          in: path
          required: true
          schema:
            type: integer
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The PDF.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The term does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
