              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queue-tickets/{queueTicket}:
    patch:
      operationId: patchQueueTicket
      summary: Advance one ticket in the payment queue
      description: >
        Accounting Staff only. `action: serve` moves `waiting` → `serving`
        (and implicitly completes whatever else was `serving` that day —
        single-active-serving); `action: complete` moves `serving` →
        `served`; `action: skip` returns either `waiting` or `serving` to
        `waiting`, stamping a fresh `requeued_at` so the ticket moves to the
        back of its own priority tier instead of losing its place;
        `action: mark_priority` flags a `waiting` ticket `priority` without
        changing its status; `action: announce` (only while `serving`) adds one
        to the ticket's `announce_count` so the Student's polled queue view
        can ring their own device again (ADR 0027) — it changes nothing else
        and writes no audit row. §17 leaves reset cadence and priority
        eligibility unconfirmed.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: queueTicket
          in: path
          required: true
          description: Queue ticket ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQueueTicketRequest"
      responses:
        "200":
          description: The transition was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueTicketResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No queue ticket exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The action does not match the ticket's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/payments:
